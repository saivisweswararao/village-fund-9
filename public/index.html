<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Village Fund</title><link rel="stylesheet" href="/css/style.css"><script src="/js/config.js"></script><script src="/js/supabase.js"></script></head><body><header class="nav"><div class="nav-inner"><div class="brand">Village Fund</div><a href="/admin/login.html">Admin</a></div></header><main class="container"><section id="list"><div class="hero"><h1>Village Contributions</h1><p class="muted">Select a village to view contributions and make a payment.</p></div><div id="villages" class="grid"><div class="spinner">Loading villages...</div></div></section><section id="detail" class="hidden"><div class="actions"><a class="btn secondary" href="/">← All Villages</a></div><div class="hero"><h1 id="name"></h1><p id="description" class="muted"></p></div><div class="card"><div class="muted">Total successful contributions</div><div id="total" class="total">₹0.00</div></div><div class="card"><h2>Make a Contribution</h2><div id="message"></div><form id="payForm"><label>Contributor Name</label><input id="contributor" maxlength="120" required><label>Amount (₹)</label><input id="amount" type="number" min="1" step="0.01" required><button id="pay" class="btn" type="submit">PAY NOW</button></form></div><div class="card"><h2>Contributions</h2><div class="table-wrap"><table><thead><tr><th>Name</th><th>Amount</th><th>Transaction Date</th><th>Payment Status</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(Number(n||0));const slug=new URLSearchParams(location.search).get('village');async function ready(){if(window.supabaseClient)return;await new Promise(r=>addEventListener('supabase-ready',r,{once:true}))}
async function list(){await ready();const{data,error}=await supabaseClient.from('villages').select('id,name,slug,description').eq('is_active',true).order('name');if(error){villages.innerHTML='<div class="error">Unable to load villages.</div>';return}if(!data?.length){villages.innerHTML='<div class="card">No active villages found.</div>';return}villages.innerHTML=data.map(v=>`<div class="card"><h2>${esc(v.name)}</h2><p class="muted">${esc(v.description||'')}</p><a class="btn" href="/?village=${encodeURIComponent(v.slug)}">View Village</a></div>`).join('')}
async function detail(s){await ready();document.getElementById('list').classList.add('hidden');document.getElementById('detail').classList.remove('hidden');const{data:v}=await supabaseClient.from('villages').select('id,name,slug,description').eq('slug',s).eq('is_active',true).maybeSingle();if(!v){document.getElementById('detail').innerHTML='<div class="error">Village not found.</div>';return}name.textContent=v.name;description.textContent=v.description||'';await Promise.all([loadTotal(v.id),loadRows(v.id)]);payForm.onsubmit=e=>payment(e,v)}
async function loadTotal(id){const{data}=await supabaseClient.from('contributions').select('amount').eq('village_id',id).eq('payment_status','success');total.textContent=fmt((data||[]).reduce((a,x)=>a+Number(x.amount),0))}async function loadRows(id){const{data,error}=await supabaseClient.from('contributions').select('contributor_name,amount,transaction_date,payment_status').eq('village_id',id).eq('payment_status','success').order('transaction_date',{ascending:false});if(error){rows.innerHTML='<tr><td colspan="4">Unable to load contributions.</td></tr>';return}rows.innerHTML=(data||[]).map(x=>`<tr><td>${esc(x.contributor_name)}</td><td>${fmt(x.amount)}</td><td>${new Date(x.transaction_date).toLocaleString('en-IN')}</td><td class="status">${esc(x.payment_status)}</td></tr>`).join('')||'<tr><td colspan="4">No successful contributions yet.</td></tr>'}
async function payment(e,v){e.preventDefault();pay.disabled=true;message.innerHTML='<div class="spinner">Creating payment...</div>';try{const{data,error}=await supabaseClient.functions.invoke('create-phonepe-payment',{body:{village_id:v.id,contributor_name:contributor.value.trim(),amount:Number(amount.value)}});if(error)throw error;if(!data?.redirect_url)throw new Error('PhonePe gateway is not configured yet.');location.href=data.redirect_url}catch(x){message.innerHTML=`<div class="error">${esc(x.message||'Unable to start payment.')}</div>`;pay.disabled=false}}
slug?detail(slug):list();</script></body></html>
