<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onboard Village</title><link rel="stylesheet" href="/css/style.css"><script src="/js/config.js"></script><script src="/js/supabase.js"></script></head><body><main class="container"><div class="card"><div class="split"><h1>Onboard Village</h1><a href="/admin/dashboard.html">Dashboard</a></div><div id="msg"></div><form id="f"><h2>Village</h2><label>Name</label><input id="vn" required><label>Slug</label><input id="slug" pattern="[a-z0-9-]+" required><label>Description</label><textarea id="desc"></textarea><h2>Village Admin</h2><label>Name</label><input id="an" required><label>Email</label><input id="ae" type="email" required><label>Mobile</label><input id="am"><h2>Fund Settings</h2><label>Monthly Amount</label><input id="monthly" type="number" min="0" step="0.01"><label>UPI ID</label><input id="upi"><label>UPI Name</label><input id="upiname"><label>UPI Instructions</label><textarea id="upiinstructions"></textarea><label>Bank Account Holder</label><input id="holder"><label>Bank Name</label><input id="bank"><label>Account Number</label><input id="account"><label>IFSC</label><input id="ifsc"><br><button id="submit" class="btn">Onboard Village</button></form></div></main><script>async function ready(){if(window.supabaseClient)return;await new Promise(r=>addEventListener('supabase-ready',r,{once:true}))}(async()=>{await ready();const{data:{user}}=await supabaseClient.auth.getUser();if(!user){location.href='/admin/login.html';return}const{data:p}=await supabaseClient.from('profiles').select('role').eq('id',user.id).maybeSingle();if(p?.role!=='super_admin')document.body.innerHTML='<main class="container"><div class="error">Super Admin access required.</div></main>'})();f.onsubmit=async e=>{e.preventDefault();await ready();submit.disabled=true;try{const{data,error}=await supabaseClient.functions.invoke('onboard-village',{body:{village:{name:vn.value.trim(),slug:slug.value.trim().toLowerCase(),description:desc.value.trim()},admin:{full_name:an.value.trim(),email:ae.value.trim(),mobile:am.value.trim()},fund_settings:{monthly_amount:monthly.value?Number(monthly.value):null,upi_id:upi.value.trim(),upi_name:upiname.value.trim(),upi_instructions:upiinstructions.value.trim(),bank_account_holder:holder.value.trim(),bank_name:bank.value.trim(),account_number:account.value.trim(),ifsc_code:ifsc.value.trim()}}});if(error)throw error;if(!data?.success)throw new Error(data?.message||'Onboarding failed');msg.innerHTML='<div class="success">Village onboarded successfully. It will now appear on the public page.</div>';f.reset()}catch(x){msg.innerHTML='<div class="error">'+(x.message||'Onboarding failed')+'</div>'}finally{submit.disabled=false}}</script></body></html>
