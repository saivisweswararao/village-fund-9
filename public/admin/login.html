<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="/css/style.css"><script src="/js/config.js"></script><script src="/js/supabase.js"></script></head><body><main class="container"><div class="card" style="max-width:480px;margin:70px auto"><h1>Admin Login</h1><div id="msg"></div><form id="f"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button class="btn">Sign In</button></form><p><a href="/">← Back</a></p></div></main><script>async function ready(){if(window.supabaseClient)return;await new Promise(r=>addEventListener('supabase-ready',r,{once:true}))}f.onsubmit=async e=>{e.preventDefault();await ready();const{data,error}=await supabaseClient.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){msg.innerHTML='<div class="error">'+error.message+'</div>';return}const{data:p}=await supabaseClient.from('profiles').select('id,role,village_id').eq('id',data.user.id).maybeSingle();if(!p||!['admin','super_admin'].includes(p.role)){await supabaseClient.auth.signOut();msg.innerHTML='<div class="error">Admin access required.</div>';return}location.href='/admin/dashboard.html'}</script></body></html>
