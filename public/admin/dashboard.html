<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="/css/style.css"><script src="/js/config.js"></script><script src="/js/supabase.js"></script></head><body><header class="nav"><div class="nav-inner"><b>Village Fund Admin</b><button id="logout" class="btn secondary">Sign out</button></div></header><main class="container"><div id="msg"></div><div class="card"><div class="split"><div><h1>Dashboard</h1><p id="role" class="muted"></p></div><div id="onboard"></div></div></div><div id="vcard" class="card hidden"><h2 id="vname"></h2><div id="total" class="total">₹0.00</div><p class="muted">Successful contributions</p><div class="table-wrap"><table><thead><tr><th>Name</th><th>Amount</th><th>Date</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>async function ready(){if(window.supabaseClient)return;await new Promise(r=>addEventListener('supabase-ready',r,{once:true}))}(async()=>{await ready();const{data:{user}}=await supabaseClient.auth.getUser();if(!user){location.href='/admin/login.html';return}const{data:p}=await supabaseClient.from('profiles').select('id,role,village_id,full_name').eq('id',user.id).maybeSingle();if(!p){location.href='/admin/login.html';return}role.textContent=`${p.full_name||user.email} · ${p.role}`;if(p.role==='super_admin'){onboard.innerHTML='<a class="btn" href="/admin/onboard-village.html">Onboard Village</a>';return}if(!p.village_id){msg.innerHTML='<div class="error">No village assigned.</div>';return}vcard.classList.remove('hidden');const{data:v}=await supabaseClient.from('villages').select('name').eq('id',p.village_id).maybeSingle();vname.textContent=v?.name||'Your Village';const{data:c}=await supabaseClient.from('contributions').select('contributor_name,amount,transaction_date,payment_status').eq('village_id',p.village_id).order('transaction_date',{ascending:false});const ok=(c||[]).filter(x=>x.payment_status==='success');total.textContent=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(ok.reduce((a,x)=>a+Number(x.amount),0));rows.innerHTML=(c||[]).map(x=>`<tr><td>${x.contributor_name}</td><td>₹${Number(x.amount).toFixed(2)}</td><td>${new Date(x.transaction_date).toLocaleString('en-IN')}</td><td>${x.payment_status}</td></tr>`).join('')||'<tr><td colspan="4">No contributions.</td></tr>'})();logout.onclick=async()=>{await supabaseClient.auth.signOut();location.href='/admin/login.html'}</script></body></html>
